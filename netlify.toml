[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Disable Pretty URLs to prevent trailing-slash stripping.
# Without this, Netlify 301-redirects /brokers/ → /brokers,
# which Cloudflare 308-redirects back to /brokers/ → infinite loop.
[build.processing.html]
  pretty_urls = false

# SPA fallback is handled by _redirects file (auto-generated by generate-static-pages.cjs).
# Do NOT add [[redirects]] here — it conflicts with flat-file rewrite rules.
